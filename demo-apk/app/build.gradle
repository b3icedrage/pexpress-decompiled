plugins {
    id 'com.android.application'
}

android {
    namespace 'com.b3icedrage.pexpressdemo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.b3icedrage.pexpressdemo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0-demo'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
